# Publishes @meser10/api-client to npm with Trusted Publishing (OIDC).
#
# No token anywhere: not in the repository, not in Actions secrets, not on
# anyone's laptop. npm verifies that the request came from this repository and
# this workflow file.
#
# One ordering detail: npm can only be told to trust a workflow for a package
# that already exists, so the FIRST publish of a new package still uses a
# granular token from a laptop. After that first publish, configure the
# matching side on npmjs.com under the package settings, Trusted Publisher:
#   Provider           GitHub Actions
#   Organization       meser10
#   Repository         meser10-node
#   Workflow filename  publish.yml
#   Environment        (leave empty)
# and every release after that needs no token at all.
#
# To release: bump the version in package.json, commit, tag it
#   git tag v1.0.1 && git push --tags
# then run this workflow from the Actions tab. The job refuses to publish if
# the tag and package.json disagree. Until the Trusted Publisher above exists,
# publishing from a laptop with a granular token is still the working route.

name: Publish to npm

# Manual only, on purpose.
#
# This job authenticates to npm with OIDC alone, which works only once a
# Trusted Publisher has been configured on npmjs.com for this package
# (Settings, Trusted Publisher, GitHub Actions). Until that exists npm answers
# the publish with a 404, so a tag push would fail every time and mail a
# failure notice on every release. It is wired to workflow_dispatch so the tag
# stays a tag, and publishing is a deliberate click.
#
# Once the Trusted Publisher is configured, restore the tag trigger by putting
# these two lines back above workflow_dispatch:
#   push:
#     tags: ['v*']
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The whole point. Without this, GitHub will not mint the OIDC token and
      # npm has no way to recognise this workflow.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14.0 or newer.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that supports trusted publishing
        # Node 22 ships npm 10, and trusted publishing needs 11.5.1 or newer.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm install

      - name: Build and test
        # 50 tests on node:test. Nothing touches the network or sends a message.
        run: npm test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG." >&2
            exit 1
          fi
          echo "Publishing version $PKG."

      - name: Publish
        # No NODE_AUTH_TOKEN and no --provenance flag. OIDC handles the
        # authentication, and npm generates the provenance attestation itself.
        run: npm publish
